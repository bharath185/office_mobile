name: Build iOS and macOS Apps

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apple:
    name: Build iOS & macOS Packages
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios --macos
          flutter pub get

      - name: Build iOS Simulator App (For Mac iOS Simulator)
        run: |
          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r -y Runner-Simulator.app.zip Runner.app
          cd ../../..

      - name: Build iOS Device App (Unsigned IPA)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          zip -r -y Runner-Device.app.zip Runner.app
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r -y OfficeConnect.ipa Payload
          cd ../../..

      - name: Build Native macOS Desktop App (Double-Click on Mac)
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r -y OfficeConnect-macOS.zip office_mobile.app
          cd ../../../../..

      - name: Upload Finished Builds
        uses: actions/upload-artifact@v4
        with:
          name: OfficeConnect-Apple-Builds
          path: |
            build/ios/iphonesimulator/Runner-Simulator.app.zip
            build/macos/Build/Products/Release/OfficeConnect-macOS.zip
            build/ios/iphoneos/OfficeConnect.ipa
            build/ios/iphoneos/Runner-Device.app.zip
          retention-days: 14
