name: office_mobile
description: "OfficeConnect Employee Self-Service Mobile Application for Android & iOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & HTTP
  dio: ^5.4.1

  # Local Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Device Hardware & Biometrics
  local_auth: ^2.1.8
  geolocator: ^14.0.2

  # UI, Icons, Typography & Utilities
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  url_launcher: ^6.2.5
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
